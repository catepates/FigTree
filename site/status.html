<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Website status · Cate Pates</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/img/fig-tree-mark.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<main class="wrap section" style="max-width: 760px">
  <h1 class="h2">Website status</h1>
  <p class="lede" style="max-width: none; margin: 8px 0 32px">Checks everything the website needs: its pages, the Google Sheet, booking and payment links, media links and the galleries' lists. Refresh to check again. The same check runs every morning and emails Cate and Dom if something breaks.</p>
  <p style="margin: -16px 0 28px"><a class="text-link" href="https://figtreestudio.goatcounter.com">Visitor stats (GoatCounter) →</a></p>
  <div class="terms" data-status><p>Checking…</p></div>
</main>
<script type="module">
const box = document.querySelector('[data-status]');
const tick = (ok) => (ok ? '✅' : '❌');
const esc = (v) => String(v ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
try {
  const s = await (await fetch('/api/status', { cache: 'no-store' })).json();
  const rows = [];
  const checks = s.checks || [];
  const fails = checks.filter((c) => c.level === 'fail');
  const warns = checks.filter((c) => c.level === 'warn');
  rows.push(`<p style="font-size: 20px">${fails.length ? `❌ ${fails.length} thing${fails.length === 1 ? ' needs' : 's need'} fixing` : '✅ Everything the site needs is working'}${warns.length ? ` · ⚠️ ${warns.length} to look at` : ''}</p>`);
  const icon = { ok: '✅', warn: '⚠️', fail: '❌' };
  const line = (c) => `<li>${icon[c.level]} <strong>${esc(c.area)}: ${esc(c.name)}</strong>: ${esc(c.detail)}${c.fix ? `<br><em>What to do:</em> ${esc(c.fix)}` : ''}</li>`;
  if (fails.length || warns.length) rows.push('<ul>' + [...fails, ...warns].map(line).join('') + '</ul>');
  rows.push(`<details><summary>All ${checks.length} checks</summary><ul>${checks.map(line).join('')}</ul></details>`);
  rows.push(`<h2 class="h3">Google Sheet</h2>`);
  if (!s.sheet.configured) {
    rows.push(`<p>${tick(false)} Not connected. Add <code>SHEET_ID</code> in Netlify → Environment variables, then retry this branch's deploy.</p>`);
  } else {
    rows.push('<ul>' + Object.entries(s.sheet.tabs).map(([tab, t]) => t.ok
      ? `<li>${tick(true)} <strong>${tab}</strong>: ${t.rows} row${t.rows === 1 ? '' : 's'}${tab === 'Studio' ? ` (${t.withPaymentLink} with a Stripe payment link)` : ''}${t.workshops && t.workshops.length ? '<ul>' + t.workshops.map((w) => `<li>${w.shown.startsWith('shown') ? '✅' : '⚠️'} ${esc(w.name)} (${esc(w.date)}): ${esc(w.shown)} · button: ${esc(w.button)}</li>`).join('') + '</ul>' : ''}</li>`
      : `<li>${tick(false)} <strong>${tab}</strong>: ${t.error}</li>`).join('') + '</ul>');
  }
  rows.push(`<h2 class="h3">Stripe</h2><ul>`);
  rows.push(`<li>${s.stripe.webhookSecretSet ? '✅' : '⚠️'} Webhook signing secret ${s.stripe.webhookSecretSet ? 'is set' : 'is not set (only needed once pieces are for sale: add <code>STRIPE_WEBHOOK_SECRET</code> in Netlify)'}</li>`);
  const sold = s.stripe.soldPieces;
  rows.push(`<li>Pieces Stripe has reported as sold: ${Array.isArray(sold) ? (sold.length ? sold.join(', ') : 'none yet') : sold}</li></ul>`);
  const v = s.vault || {};
  rows.push(`<h2 class="h3">The Vault</h2><ul>`);
  if (!v.ok) {
    rows.push(`<li>${tick(false)} Couldn't reach The Vault's website (${esc(v.error)}). The Gallery page keeps showing the list from the last build.</li>`);
  } else if (v.listed === 0) {
    rows.push(`<li>⚠️ The Vault's page loaded but no pieces could be read. Either nothing of Cate's is listed there, or The Vault has changed its page layout and <code>scripts/vault-parse.mjs</code> needs updating. Until then the Gallery page shows the list from the last build.</li>`);
  } else {
    rows.push(`<li>${tick(true)} The Vault's page can be read: ${v.listed} piece${v.listed === 1 ? '' : 's'} listed now.</li>`);
  }
  if (v.builtAt) {
    rows.push(`<li>Last build (${esc(new Date(v.builtAt).toLocaleString('en-NZ'))}) had ${v.built} piece${v.built === 1 ? '' : 's'}.`
      + (v.goneSinceBuild?.length ? ` Gone since (sold or removed, hidden on the site within the hour): ${v.goneSinceBuild.map(esc).join(', ')}.` : '')
      + (v.newSinceBuild?.length ? ` New since (shown with The Vault's own photo until the next build): ${v.newSinceBuild.map(esc).join(', ')}.` : '')
      + '</li>');
  }
  rows.push('</ul>');
  box.innerHTML = rows.join('');
} catch {
  box.innerHTML = '<p>❌ The status check itself isn\'t available. It only works on the Netlify site, not when the pages are opened as files.</p>';
}
</script>
<script src="/js/links.js" defer></script>
</body>
</html>
